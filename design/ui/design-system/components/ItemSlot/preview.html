<!-- @dsCard group="Items" height=200 subtitle="Sizes, upgrade marks, stacks, rare, selected, empty, locked" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ItemSlot preview</title></head>
<body>
<div class="ab-demo">
  <div class="ab-grid" style="grid-template-columns: repeat(7, var(--size-slot));">
    <button class="ab-slot ab-slot--h3 ab-slot--selected" aria-label="Iron Longsword +6"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6"></path><path d="m16 16 4 4"></path><path d="m19 21 2-2"></path></svg><span class="ab-slot__plus ab-slot__plus--gold">+6</span></button>
    <button class="ab-slot ab-slot--h3" aria-label="Ash Greataxe +7"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4 4 20"></path><path d="M12.5 6.5C14 4 17 3 20 3.5c.5 3-.5 6-3 7.5z"></path></svg><span class="ab-slot__plus ab-slot__plus--arcane">+7</span></button>
    <button class="ab-slot ab-slot--h2" aria-label="Chain Hauberk +2"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3 4 5.5v5L6 12v9h12v-9l2-1.5v-5L16 3c-.7 1.6-2.2 2.5-4 2.5S8.7 4.6 8 3z"></path></svg><span class="ab-slot__plus">+2</span></button>
    <button class="ab-slot" aria-label="Health Potion II, 37"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v5.5L4.8 17.2A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.2-3.8L14 8.5V3"></path><path d="M7 15h10"></path></svg><span class="ab-slot__count">37</span></button>
    <button class="ab-slot" aria-label="Ash Ember, 100"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7.5 5.5-2.5 10.5h-10L4.5 8.5z"></path><path d="m4.5 8.5 7.5 3.5 7.5-3.5M12 12v7"></path></svg><span class="ab-slot__count">100</span></button>
    <button class="ab-slot ab-slot--rare" aria-label="Warding Seal, rare, 2"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="10" r="6"></circle><path d="m9 15-1 6 4-2 4 2-1-6"></path></svg><span class="ab-slot__count">2</span></button>
    <button class="ab-slot" aria-label="Copper Ring"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14.5" r="6"></circle><path d="m9.5 6 2.5-3 2.5 3-2.5 2.5z"></path></svg></button>
    <span class="ab-slot ab-slot--empty"></span>
    <span class="ab-slot ab-slot--empty ab-slot--drop"></span>
    <span class="ab-slot ab-slot--locked"><svg class="ab-icon ab-icon--16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg></span>
    <span class="ab-slot ab-slot--locked"><svg class="ab-icon ab-icon--16" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg></span>
  </div>
</div>
</body>
</html>
