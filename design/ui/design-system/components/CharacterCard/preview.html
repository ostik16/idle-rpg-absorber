<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CharacterCard preview</title></head>
<body>
<div class="ab-demo ab-demo--col" style="max-width: 390px;">
  <a class="ab-char" href="#kaela">
    <span class="ab-char__avatar" aria-hidden="true">K</span>
    <span>
      <span class="ab-char__top"><span class="ab-char__name">Kaela</span><span class="ab-level">Lv 14</span><span class="ab-status ab-status--farming"><svg class="ab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6"></path><path d="m16 16 4 4"></path><path d="m19 21 2-2"></path><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"></path><path d="m5 14 4 4"></path><path d="m7 17-3 3"></path><path d="m3 19 2 2"></path></svg>Farming</span></span>

      </span>
      <span class="ab-char__stats"><span class="ab-char__stat"><b>1,240</b> / h</span><span class="ab-char__stat">Bag <b>31/42</b></span><span class="ab-char__stat">Potions <b>14</b></span></span>

  </a>
  <a class="ab-char" href="#brann">

      <span class="ab-char__bars">
        <span class="ab-bar ab-bar--thin"><span class="ab-bar__track" role="progressbar" aria-label="Health" aria-valuenow="54" aria-valuemin="0" aria-valuemax="100"><span class="ab-bar__fill" style="display: block; width: 54%;"></span></span></span>
        <span class="ab-bar ab-bar--thin ab-bar--xp"><span class="ab-bar__track" role="progressbar" aria-label="Experience" aria-valuenow="88" aria-valuemin="0" aria-valuemax="100"><span class="ab-bar__fill" style="display: block; width: 88%;"></span></span></span>
      </span>
      <span class="ab-char__stats"><span class="ab-char__stat"><b>610</b> / h</span><span class="ab-char__stat ab-char__stat--warn">Bag <b>39/42</b></span><span class="ab-char__stat ab-char__stat--warn">Potions <b>3</b></span></span>
    </span>
  </a>

    <span><span class="ab-char__name" style="display: block;">Slot 6</span><span class="ab-char__where" style="display: block;">Unlocks when a character reaches Lv 30</span></span>
  </div>
</div>
</body>
</html>
