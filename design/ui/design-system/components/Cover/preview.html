<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Idle RPG Absorber</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .gold { fill: var(--gold); }
  .golddeep { fill: var(--gold-deep); }
  .deep { fill: var(--surface-3); }
  .essence { fill: var(--essence); }
  .arcane { fill: var(--arcane); }
  .blk { rx: var(--radius-md); }
  .sat { rx: var(--radius-sm); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display); font-size: 64px; line-height: .95; font-weight: 700; letter-spacing: .01em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 2px; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      gold 96×276 slab bled off the top, first (identity, largest) · surface-3 232×216 dark field · essence 112×168 bleeding off the right · arcane 40×40 once (it only ever means rare): about 30% of 960×288
  arrangement one tall gold slab with a dark field and two satellites, bottoms on one line space-6 above the edge, space-4 gutters
  pattern     discs, from "essence belongs to absorption": essence discs on a space-6 pitch shrink as they near the gold slab, three already gold-deep inside it
  scales      sides in space-2 multiples; gutters space-4; pitch space-6; corners radius-md, satellite radius-sm; largest disc a space-4 diameter
-->
<rect class="gold blk" x="24" y="-12" width="96" height="276" rx="10"></rect>
<rect class="deep blk" x="136" y="48" width="232" height="216" rx="10"></rect>
<rect class="essence blk" x="384" y="96" width="112" height="168" rx="10"></rect>
<rect class="arcane sat" x="384" y="40" width="40" height="40" rx="6"></rect>
<circle class="golddeep" cx="48" cy="240" r="3"></circle>
<circle class="golddeep" cx="72" cy="240" r="3"></circle>
<circle class="golddeep" cx="96" cy="240" r="3"></circle>
<circle class="essence" cx="160" cy="192" r="1.5"></circle>
<circle class="essence" cx="184" cy="192" r="2"></circle>
<circle class="essence" cx="208" cy="192" r="2.5"></circle>
<circle class="essence" cx="232" cy="192" r="3"></circle>
<circle class="essence" cx="256" cy="192" r="4"></circle>
<circle class="essence" cx="280" cy="192" r="5"></circle>
<circle class="essence" cx="304" cy="192" r="6"></circle>
<circle class="essence" cx="328" cy="192" r="7"></circle>
<circle class="essence" cx="352" cy="192" r="8"></circle>
<circle class="essence" cx="160" cy="216" r="1.5"></circle>
<circle class="essence" cx="184" cy="216" r="2"></circle>
<circle class="essence" cx="208" cy="216" r="2.5"></circle>
<circle class="essence" cx="232" cy="216" r="3"></circle>
<circle class="essence" cx="256" cy="216" r="4"></circle>
<circle class="essence" cx="280" cy="216" r="5"></circle>
<circle class="essence" cx="304" cy="216" r="6"></circle>
<circle class="essence" cx="328" cy="216" r="7"></circle>
<circle class="essence" cx="352" cy="216" r="8"></circle>
<circle class="essence" cx="160" cy="240" r="1.5"></circle>
<circle class="essence" cx="184" cy="240" r="2"></circle>
<circle class="essence" cx="208" cy="240" r="2.5"></circle>
<circle class="essence" cx="232" cy="240" r="3"></circle>
<circle class="essence" cx="256" cy="240" r="4"></circle>
<circle class="essence" cx="280" cy="240" r="5"></circle>
<circle class="essence" cx="304" cy="240" r="6"></circle>
<circle class="essence" cx="328" cy="240" r="7"></circle>
<circle class="essence" cx="352" cy="240" r="8"></circle>
</svg>
</div>
<div class="words">
<h1 class="name">Idle RPG<br>Absorber</h1>
<p class="tag">Night-dark panels, gilded actions, essence that glows.</p>
</div>
</div>
</body>
</html>
