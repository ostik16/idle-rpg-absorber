<!-- @dsCard group="Status" height=230 subtitle="Health, mana, XP with character-point ticks, absorption" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ResourceBar preview</title></head>
<body>
<div class="ab-demo ab-demo--col" style="max-width: 360px;">
  <div class="ab-bar">
    <div class="ab-bar__head"><span>Health</span><span class="ab-bar__value">412 / 560</span></div>
    <div class="ab-bar__track" role="progressbar" aria-label="Health" aria-valuenow="412" aria-valuemin="0" aria-valuemax="560"><div class="ab-bar__fill" style="width: 73.6%;"></div></div>
  </div>
  <div class="ab-bar ab-bar--mana">
    <div class="ab-bar__head"><span>Mana</span><span class="ab-bar__value">96 / 180</span></div>
    <div class="ab-bar__track" role="progressbar" aria-label="Mana" aria-valuenow="96" aria-valuemin="0" aria-valuemax="180"><div class="ab-bar__fill" style="width: 53%;"></div></div>
  </div>
  <div class="ab-bar ab-bar--xp">
    <div class="ab-bar__head"><span>XP · Lv 14</span><span class="ab-bar__value">64% · next point at 75%</span></div>
    <div class="ab-bar__track" role="progressbar" aria-label="Experience" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><div class="ab-bar__fill" style="width: 64%;"></div><span class="ab-bar__tick" style="left: 25%;"></span><span class="ab-bar__tick" style="left: 50%;"></span><span class="ab-bar__tick" style="left: 75%;"></span></div>
  </div>
  <div class="ab-bar ab-bar--essence">
    <div class="ab-bar__head"><span>Life steal</span><span class="ab-bar__value">4.2% of 6.0%</span></div>
    <div class="ab-bar__track" role="progressbar" aria-label="Life steal absorbed" aria-valuenow="4.2" aria-valuemin="0" aria-valuemax="6"><div class="ab-bar__fill" style="width: 70%;"></div></div>
  </div>
</div>
</body>
</html>
