<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Cinzel:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0d0e13}
a{color:#e4b95b}a:hover{color:#f0cd7f}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #e4b95b;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #0d0e13; color: #eee8d9; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 22px;">

  <header style="flex: none; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 8px 0 16px; box-sizing: border-box; background: #161821; border-bottom: 1px solid #323748;">
    <h1 style="flex: 1; margin: 0; font-family: 'Cinzel', Georgia, serif; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0.02em;">Roster</h1>
    <button aria-label="Gold 48,210. Open menu" style="display: flex; align-items: center; height: 44px; padding: 0 4px; border: 0; background: transparent; cursor: pointer;"><span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px; border-radius: 999px; background: #2e2614; color: #e4b95b; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle></svg>48,210</span></button>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px;">

    <section aria-label="Roster summary" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #161821; border: 1px solid #323748; border-radius: 10px;">
      <div style="padding: 10px 12px; border-right: 1px solid #323748;">
        <div style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa596;">Farming</div>
        <div style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums;">2 <span style="font-size: 15px; font-weight: 600; color: #aaa596;">of 5</span></div>
      </div>
      <div style="padding: 10px 12px; border-right: 1px solid #323748;">
        <div style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa596;">Gold / h</div>
        <div style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: #e4b95b;">1,850</div>
      </div>
      <div style="padding: 10px 12px;">
        <div style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa596;">Warehouse</div>
        <div style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; font-variant-numeric: tabular-nums;">41<span style="font-size: 15px; font-weight: 600; color: #aaa596;">/56</span></div>
      </div>
    </section>

    <div style="flex: none; display: flex; align-items: center; gap: 8px; margin-top: 4px;">
      <span aria-hidden="true" style="width: 6px; height: 6px; background: #e4b95b; transform: rotate(45deg);"></span>
      <h2 style="margin: 0; flex: 1; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa596;">Characters</h2>
      <span style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; color: #aaa596;">5 of 5 slots</span>
    </div>

    <sc-for list="{{chars}}" as="c" hint-placeholder-count="5">
      <a href="Character-Farm.dc.html" style="flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; padding: 12px 14px 12px 12px; background: #161821; border: 1px solid #323748; border-radius: 10px; color: #eee8d9; text-decoration: none;">
        <span aria-hidden="true" style="display: grid; place-items: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #707896; border-radius: 6px; background: #292d3b; font-family: 'Cinzel', Georgia, serif; font-size: 20px; font-weight: 700;">{{c.initial}}</span>
        <span style="display: flex; flex-direction: column; min-width: 0;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="font-family: 'Cinzel', Georgia, serif; font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: 0.02em;">{{c.name}}</span>
            <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 38px; height: 22px; padding: 0 6px; box-sizing: border-box; border: 1px solid #b88a2e; border-radius: 3px; background: #2e2614; color: #e4b95b; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;">Lv {{c.level}}</span>
            <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 6px; border-radius: 999px; background: #1f222d; color: {{c.statusColor}}; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;">
              <sc-if value="{{c.farming}}" hint-placeholder-val="{{ true }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"></path><path d="m13 19 6-6"></path><path d="m16 16 4 4"></path><path d="m19 21 2-2"></path><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"></path><path d="m5 14 4 4"></path><path d="m7 17-3 3"></path><path d="m3 19 2 2"></path></svg></sc-if>
              <sc-if value="{{c.travel}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 3c-1.7 0-3 2-3 4.5 0 1.8.6 3.6 1.5 5h3c.9-1.4 1.5-3.2 1.5-5C11 5 9.7 3 8 3z"></path><path d="M6.5 15.5h3V17a1.5 1.5 0 0 1-3 0z"></path><path d="M16 7c1.7 0 3 2 3 4.5 0 1.8-.6 3.6-1.5 5h-3c-.9-1.4-1.5-3.2-1.5-5C13 9 14.3 7 16 7z"></path><path d="M14.5 19.5h3V21a1.5 1.5 0 0 1-3 0z"></path></svg></sc-if>
              <sc-if value="{{c.city}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9v12h14V9"></path><path d="M10 21v-6h4v6"></path></svg></sc-if>
              <sc-if value="{{c.dead}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7c0 2.6 1.3 4.4 3 5.4V19a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-3.6c1.7-1 3-2.8 3-5.4a7 7 0 0 0-7-7z"></path><circle cx="9.5" cy="10.5" r="1.5"></circle><circle cx="14.5" cy="10.5" r="1.5"></circle></svg></sc-if>
              {{c.statusLabel}}
            </span>
          </span>
          <span style="margin-top: 2px; font-size: 13px; line-height: 18px; color: #aaa596; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.where}}</span>
          <span style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 8px;">
            <span style="display: flex; align-items: center; gap: 6px;">
              <span style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #aaa596;">HP</span>
              <span role="progressbar" aria-label="Health" aria-valuenow="{{c.hpNum}}" aria-valuemin="0" aria-valuemax="100" style="position: relative; flex: 1; height: 4px; border-radius: 999px; background: #2a2e3b; overflow: hidden;"><span style="display: block; height: 100%; width: {{c.hp}}; border-radius: 999px; background: #e5484d;"></span></span>
            </span>
            <span style="display: flex; align-items: center; gap: 6px;">
              <span style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; color: #aaa596;">XP</span>
              <span role="progressbar" aria-label="Experience" aria-valuenow="{{c.xpNum}}" aria-valuemin="0" aria-valuemax="100" style="position: relative; flex: 1; height: 4px; border-radius: 999px; background: #2a2e3b; overflow: hidden;"><span style="display: block; height: 100%; width: {{c.xp}}; border-radius: 999px; background: #a3d977;"></span><span style="position: absolute; top: 0; bottom: 0; left: 25%; width: 2px; background: #161821;"></span><span style="position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: #161821;"></span><span style="position: absolute; top: 0; bottom: 0; left: 75%; width: 2px; background: #161821;"></span></span>
            </span>
          </span>
          <span style="display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 13px; line-height: 18px; font-weight: 600; color: #aaa596; font-variant-numeric: tabular-nums;">
            <span style="display: inline-flex; align-items: center; gap: 4px;"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="color: #e4b95b;"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.5"></circle></svg><b style="font-weight: 600; color: #eee8d9;">{{c.gph}}</b> / h</span>
            <span style="display: inline-flex; align-items: center; gap: 4px; color: {{c.bagC}};"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 10a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"></path><path d="M9 5V3h6v2"></path><path d="M8 21v-6h8v6"></path></svg>Bag <b style="font-weight: 600; color: {{c.bagV}};">{{c.bag}}</b></span>
            <span style="display: inline-flex; align-items: center; gap: 4px; color: {{c.potC}};"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v5.5L4.8 17.2A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.2-3.8L14 8.5V3"></path><path d="M7 15h10"></path></svg>Potions <b style="font-weight: 600; color: {{c.potV}};">{{c.pots}}</b></span>
          </span>
        </span>
      </a>
    </sc-for>

    <div style="flex: none; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border: 1px dashed #323748; border-radius: 10px; color: #aaa596;">
      <span aria-hidden="true" style="display: grid; place-items: center; width: 44px; height: 44px; box-sizing: border-box; border: 1px dashed #707896; border-radius: 6px; color: #707896;"><svg class="ic" viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11"></path></svg></span>
      <span style="display: flex; flex-direction: column;">
        <span style="font-family: 'Cinzel', Georgia, serif; font-size: 17px; line-height: 22px; font-weight: 700; letter-spacing: 0.02em; color: #eee8d9;">Slot 6</span>
        <span style="font-size: 13px; line-height: 18px;">Unlocks when a character reaches Lv 30</span>
      </span>
    </div>
  </main>

  <nav aria-label="Main" style="flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); height: 64px; background: #161821; border-top: 1px solid #323748;">
    <a href="Main.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #e4b95b; text-decoration: none; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em;"><span style="position: absolute; top: -1px; left: 32%; right: 32%; height: 2px; border-radius: 0 0 2px 2px; background: #e4b95b;"></span><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"></path><path d="M18 14.3c2 .7 3.5 2.8 3.5 5.7"></path></svg>Roster</a>
    <a href="World.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa596; text-decoration: none; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em;"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 4 3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5z"></path><path d="M9 4v13.5M15 6.5V20"></path></svg>World</a>
    <a href="City.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa596; text-decoration: none; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em;"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 21V9h3V6h2v3h2V4h2v5h2V6h2v3h3v12z"></path><path d="M10 21v-4a2 2 0 0 1 4 0v4"></path></svg>City</a>
    <a href="Bestiary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #aaa596; text-decoration: none; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em;"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2.5z"></path><path d="M4 19.5A2 2 0 0 0 6 21h14v-4"></path></svg>Bestiary</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var POS = '#8fd16a', INFO = '#79adff', GOLD = '#e4b95b', DANGER = '#f2706a', WARN = '#f0a04b', MUTED = '#aaa596', INK = '#eee8d9';
    function ch(o) {
      var s = o.status;
      return Object.assign({
        farming: s === 'farming', travel: s === 'travel', city: s === 'city', dead: s === 'dead',
        statusColor: s === 'farming' ? POS : s === 'travel' ? INFO : s === 'city' ? GOLD : DANGER,
        hp: o.hpNum + '%', xp: o.xpNum + '%',
        bagC: o.bagWarn ? WARN : MUTED, bagV: o.bagWarn ? WARN : INK,
        potC: o.potWarn ? WARN : MUTED, potV: o.potWarn ? WARN : INK
      }, o);
    }
    return {
      chars: [
        ch({ initial: 'K', name: 'Kaela', level: 14, status: 'farming', statusLabel: 'Farming', where: 'Emberroot Vale · Lv 10–16', hpNum: 82, xpNum: 64, gph: '1,240', bag: '31/42', pots: '14' }),
        ch({ initial: 'Y', name: 'Ysolde', level: 22, status: 'travel', statusLabel: 'Travelling 3m 12s', where: 'To Frostmere Pass · Lv 18–24', hpNum: 100, xpNum: 31, gph: '—', bag: '9/56', pots: '30' }),
        ch({ initial: 'B', name: 'Brann', level: 6, status: 'farming', statusLabel: 'Farming', where: 'Ashen Ford · targeting Mire Wisp', hpNum: 54, xpNum: 88, gph: '610', bag: '39/42', pots: '3', bagWarn: true, potWarn: true }),
        ch({ initial: 'T', name: 'Tamsin', level: 3, status: 'city', statusLabel: 'In city', where: 'Restocking at the Alchemist', hpNum: 100, xpNum: 12, gph: '—', bag: '4/36', pots: '6' }),
        ch({ initial: 'O', name: 'Oric', level: 9, status: 'dead', statusLabel: 'Fell', where: 'Hollow Barrows · lost 12% XP · back in 1m 40s', hpNum: 0, xpNum: 40, gph: '—', bag: '22/42', pots: '0', potWarn: true })
      ]
    };
  }
}
</script>
</body>
</html>
