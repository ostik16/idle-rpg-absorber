<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send to Thornwatch Ruins</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Cinzel:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0d0e13}
a{color:#e4b95b}a:hover{color:#f0cd7f}
.ic{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #e4b95b;outline-offset:2px}
input[type=radio]{accent-color:#e4b95b}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0d0e13; color: #eee8d9; font-family: 'Barlow', system-ui, sans-serif; font-size: 15px; line-height: 22px;">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; box-sizing: border-box; background: #161821; border-bottom: 1px solid #323748; font-family: 'Cinzel', Georgia, serif; font-size: 22px; font-weight: 700; letter-spacing: 0.02em;">World</div>
    <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="height: 92px; background: #161821; border: 1px solid #323748; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 700;">Saltmarsh Reach</div>
      <div style="height: 112px; background: #161821; border: 1px solid #b88a2e; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 700;">Emberroot Vale</div>
      <div style="height: 92px; background: #161821; border: 1px solid #323748; border-radius: 10px; padding: 12px 14px; box-sizing: border-box; font-family: 'Cinzel', Georgia, serif; font-size: 17px; font-weight: 700;">Thornwatch Ruins</div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(5, 6, 9, 0.72);">
    <section role="dialog" aria-modal="true" aria-labelledby="sheet-h" style="max-height: 780px; overflow-y: auto; padding: 0 16px 20px; background: #161821; border-top: 1px solid #707896; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 32px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 14px;">
      <div aria-hidden="true" style="width: 36px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: #707896;"></div>

      <div style="display: flex; align-items: flex-start; gap: 8px;">
        <div style="flex: 1;">
          <h2 id="sheet-h" style="margin: 0; font-family: 'Cinzel', Georgia, serif; font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: 0.02em;">Thornwatch Ruins</h2>
          <div style="font-size: 13px; line-height: 18px; color: #aaa596;">Lv 14–20 · for Kaela, Lv 14</div>
        </div>
        <a href="World.dc.html" aria-label="Close" style="display: grid; place-items: center; width: 44px; height: 44px; margin-right: -8px; border-radius: 6px; color: #aaa596;"><svg class="ic" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 6px;">
        <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #1f222d; color: #8fd16a; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;">Drops 100%</span>
        <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; background: #1f222d; color: #f0a04b; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.04em;">Enemies up to +6 levels</span>
      </div>

      <fieldset style="margin: 0; padding: 0; border: 0;">
        <legend style="padding: 0; margin-bottom: 4px; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa596;">Target</legend>
        <sc-for list="{{targets}}" as="t" hint-placeholder-count="4">
          <label style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 52px; padding: 0 10px; margin-top: 4px; border: 1px solid {{t.edge}}; border-radius: 6px; background: {{t.bg}}; cursor: pointer;">
            <input type="radio" name="target" checked="{{t.checked}}" onChange="{{t.pick}}" style="width: 18px; height: 18px; margin: 0;">
            <span style="display: flex; flex-direction: column; min-width: 0;">
              <span style="font-weight: 600;">{{t.name}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #aaa596;">{{t.sub}}</span>
            </span>
            <sc-if value="{{t.hasTrait}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 3px; background: {{t.traitBg}}; color: {{t.traitFg}}; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; white-space: nowrap;">{{t.trait}}</span></sc-if>
          </label>
        </sc-for>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa596;">Also spawns</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; box-sizing: border-box; border: 1px solid #f0a04b; border-radius: 3px; color: #f0a04b; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;">Mini-boss · Old Tusk · 2%</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; box-sizing: border-box; border: 1px solid #b79bff; border-radius: 3px; background: #2a2140; color: #b79bff; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;">Cursed Monolith · 1%</span>
        </div>
      </div>

      <div role="radiogroup" aria-label="How to travel" style="display: flex; gap: 2px; padding: 3px; border: 1px solid #323748; border-radius: 6px; background: #1f222d;">
        <button role="radio" aria-checked="{{walkOn}}" onClick="{{pickWalk}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 46px; border: 0; border-radius: 4px; background: {{walkBg}}; box-shadow: {{walkRing}}; color: {{walkFg}}; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer;"><span>Walk</span><span style="font-size: 12px; color: #aaa596;">1m 20s · free</span></button>
        <button role="radio" aria-checked="{{portOn}}" onClick="{{pickPort}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 46px; border: 0; border-radius: 4px; background: {{portBg}}; box-shadow: {{portRing}}; color: {{portFg}}; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.04em; cursor: pointer;"><span>Teleporter</span><span style="font-size: 12px; color: #aaa596;">now · 800 gold</span></button>
      </div>

      <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 52px; border: 1px solid #e4b95b; border-radius: 6px; background: #e4b95b; color: #1a1307; font: inherit; cursor: pointer;"><span style="font-weight: 700;">Send Kaela</span><span style="font-size: 13px; line-height: 16px; font-weight: 500;">{{sendNote}}</span></button>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { target: 'any', travel: 'walk' };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var list = [
      { id: 'any', name: 'Any enemy', sub: '6s between fights' },
      { id: 'hound', name: 'Thorn Hound · Lv 14', sub: 'Targeting ×2 · 12s between fights', trait: 'Thorns 5%', magic: false },
      { id: 'sentinel', name: 'Ruin Sentinel · Lv 17', sub: 'Targeting ×4 · 24s between fights', trait: 'Frost affinity 6%', magic: true },
      { id: 'witch', name: 'Bramble Witch · Lv 19', sub: 'Targeting ×6 · 36s between fights', trait: 'Poison affinity 10%', magic: true }
    ];
    var targets = list.map(function (t) {
      var on = s.target === t.id;
      return {
        name: t.name, sub: t.sub, checked: on,
        hasTrait: !!t.trait, trait: t.trait || '',
        traitBg: t.magic ? '#0f2e2b' : '#1f222d', traitFg: t.magic ? '#5cd6c6' : '#aaa596',
        edge: on ? '#e4b95b' : '#323748', bg: on ? '#1f222d' : 'transparent',
        pick: function () { self.setState({ target: t.id }); }
      };
    });
    var walk = s.travel === 'walk';
    var ring = 'inset 0 0 0 1px #707896';
    return {
      targets: targets,
      walkOn: walk ? 'true' : 'false', portOn: walk ? 'false' : 'true',
      walkBg: walk ? '#292d3b' : 'transparent', portBg: walk ? 'transparent' : '#292d3b',
      walkRing: walk ? ring : 'none', portRing: walk ? 'none' : ring,
      walkFg: walk ? '#e4b95b' : '#eee8d9', portFg: walk ? '#eee8d9' : '#e4b95b',
      pickWalk: function () { self.setState({ travel: 'walk' }); },
      pickPort: function () { self.setState({ travel: 'port' }); },
      sendNote: walk ? 'Arrives in 1m 20s' : 'Arrives now · 800 gold'
    };
  }
}
</script>
</body>
</html>
