        ['Arcane Shard', 'gem', 1, 2, 1, 0, 3, 1], ['Warding Seal', 'seal', 2, 2, 1, 0, 2, 1], ['Tome of Insight', 'book', 3, 2, 1, 0, 0, 1],
        ['Health Potion II', 'flask', 4, 2, 1, 0, 40], ['Mana Potion I', 'flask', 5, 2, 1, 0, 25], ['Health Potion I', 'flask', 6, 2, 1, 0, 100], ['Waystone', 'gem', 7, 2, 1, 0, 4, 1],
        ['Iron Longsword', 'sword', 1, 3, 3, 6], ['Ash Greataxe', 'axe', 2, 3, 3, 7], ["Hunter's Spear", 'sword', 3, 3, 3, 1],
        ['Iron Shield', 'shield', 4, 3, 2, 3], ['Chain Hauberk', 'armor', 5, 3, 2, 2], ['Ember Gauntlets', 'glove', 6, 3, 1], ['Silver Ring', 'ring', 7, 3, 1, 2],
        ['Copper Ring', 'ring', 6, 4, 1], ['Bone Charm', 'ring', 7, 4, 1], ['Iron Helm', 'helm', 4, 5, 1, 1], ['Hide Boots', 'boot', 5, 5, 1],
        ['Wolf Pelt', 'ore', 6, 5, 1, 0, 12], ['Barrow Bone', 'ore', 7, 5, 1, 0, 100],
        ['Leather Jerkin', 'armor', 1, 6, 2], ['Bone Axe', 'axe', 2, 6, 3], ['Health Potion II', 'flask', 3, 6, 1, 0, 100]
      ]),
      side: 'bag', ids: ['b2', 'b3'], msg: '', msgKind: '', seq: 1
    };
  }
  title(x) {
    return x.name + (x.plus ? ' +' + x.plus : '') + (x.count ? ' ×' + x.count : '');
  }
  join(a) {
    if (a.length <= 1) return a[0] || '';
    return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  }
  pick(side, id) {
    var s = this.state;
    var ids = s.side === side ? s.ids.slice() : [];
    var i = ids.indexOf(id);
    if (i >= 0) ids.splice(i, 1); else ids.push(id);
    this.setState({ side: side, ids: ids, msg: '' });
  }
  move(fromKey, toKey, cols, rows, where, cap) {
    var self = this, s = this.state;
    var clone = function (x) { return Object.assign({}, x); };
    var from = s[fromKey].map(clone), to = s[toKey].map(clone);
    var moved = [], failed = [], seq = s.seq;
    function findSpot(span) {
      var g = {};
      to.forEach(function (t) { for (var k = 0; k < t.span; k++) g[t.col + ',' + (t.row + k)] = 1; });
      for (var c = 1; c <= cols; c++) {
        for (var r = 1; r + span - 1 <= rows; r++) {
          var ok = true;
          for (var k = 0; k < span; k++) if (g[c + ',' + (r + k)]) ok = false;
          if (ok) return { col: c, row: r };
        }
      }
      return null;
    }
    from.forEach(function (m) {
      if (s.ids.indexOf(m.id) < 0) return;
      var orig = m.count, left = m.count, pieces = 0;
      if (m.count) {
        to.forEach(function (t) {
          if (left > 0 && t.name === m.name && t.count && t.count < cap) {
            var add = Math.min(cap - t.count, left); t.count += add; left -= add;
          }
        });
        while (left > 0) {
          var at = findSpot(m.span);
          if (!at) break;
          var n = Math.min(cap, left);
          to.push(Object.assign({}, m, { id: 'm' + (seq++), col: at.col, row: at.row, count: n }));
          left -= n; pieces++;
        }
        if (left === 0) { m.gone = true; moved.push(self.title(m) + (pieces > 1 ? ' in ' + pieces + ' stacks' : '')); return; }
        if (left < orig) { moved.push(m.name + ' ×' + (orig - left)); m.count = left; }
        failed.push(m);
        return;
      }
      var spot = findSpot(m.span);
      if (spot) {
        to.push(Object.assign({}, m, { id: 'm' + (seq++), col: spot.col, row: spot.row }));
        m.gone = true;
        moved.push(self.title(m));
      } else {
        failed.push(m);
      }
    });
    var msg = moved.length ? 'Moved ' + this.join(moved) + ' to ' + where + '.' : '';
    if (failed.length) {
      var f = failed[0];
      msg += (msg ? ' ' : '') + 'No room for ' + this.join(failed.map(function (x) { return self.title(x); })) + (f.span > 1 ? ': it needs ' + f.span + ' free cells in one column.' : '.');
    }
    var next = { ids: [], seq: seq, msg: msg, msgKind: failed.length ? 'warn' : 'ok' };
    next[fromKey] = from.filter(function (x) { return !x.gone; });
    next[toKey] = to;
    this.setState(next);
  }
  renderVals() {
    var self = this, s = this.state;
    var KINDS = ['sword', 'axe', 'armor', 'ring', 'flask', 'ore', 'glove', 'seal', 'gem', 'boot', 'helm', 'shield', 'book'];
    function view(x, side) {
      var sel = s.side === side && s.ids.indexOf(x.id) >= 0;
      var o = { col: String(x.col), row: x.row + ' / span ' + x.span, sel: sel, pressed: sel ? 'true' : 'false' };
      KINDS.forEach(function (k) { o[k] = k === x.kind; });
      o.hasPlus = x.plus > 0; o.plus = '+' + x.plus;
      o.plusColor = x.plus >= 7 ? '#b79bff' : x.plus >= 4 ? '#e4b95b' : '#aaa596';
      o.hasCount = x.count > 0; o.count = String(x.count);
      o.bg = x.rare ? '#2a2140' : '#1f222d';
      o.fg = x.rare ? '#b79bff' : '#aaa596';
      o.border = sel ? '2px solid #e4b95b' : x.rare ? '1px solid #2a2140' : '1px solid #323748';
      o.label = self.title(x) + (x.rare ? ', rare' : '') + (sel ? ', selected' : '');
      o.pick = function () { self.pick(side, x.id); };
      return o;
    }
    function used(list) { return list.reduce(function (n, x) { return n + x.span; }, 0); }
    function cells(n) { var a = []; for (var i = 0; i < n; i++) a.push({ i: i }); return a; }
    var nBag = s.side === 'bag' ? s.ids.length : 0;
    var nWh = s.side === 'wh' ? s.ids.length : 0;
    var hint = s.ids.length
      ? s.ids.length + ' selected in ' + (s.side === 'bag' ? "Tamsin's bag" : 'the warehouse') + '. Tap again to unselect.'
      : 'Tap items in either grid, then move them.';
    return {
      bagItems: s.bag.map(function (x) { return view(x, 'bag'); }),
      whItems: s.wh.map(function (x) { return view(x, 'wh'); }),
      bagCells: cells(36), whCells: cells(56),
      bagUsed: String(used(s.bag)), whUsed: String(used(s.wh)),
      toWh: function () { if (s.side === 'bag' && s.ids.length) self.move('bag', 'wh', 7, 8, 'the warehouse', 100); },
      toBag: function () { if (s.side === 'wh' && s.ids.length) self.move('wh', 'bag', 6, 6, "Tamsin's bag", 20); },
      whDisabled: nBag === 0, bagDisabled: nWh === 0,
      hasWhCount: nBag > 0, hasBagCount: nWh > 0,
      whCount: String(nBag), bagCount: String(nWh),
      whBg: nBag ? '#e4b95b' : '#161821', whBorder: nBag ? '#e4b95b' : '#323748', whFg: nBag ? '#1a1307' : '#aaa596',
      bagBg: nWh ? '#e4b95b' : '#161821', bagBorder: nWh ? '#e4b95b' : '#323748', bagFg: nWh ? '#1a1307' : '#aaa596',
      toWhLabel: nBag ? 'Move ' + nBag + ' selected to the warehouse' : 'Move to the warehouse. Select items in the bag first',
      toBagLabel: nWh ? 'Move ' + nWh + " selected to Tamsin's bag" : "Move to Tamsin's bag. Select items in the warehouse first",
      msg: s.msg || hint,
      msgColor: s.msg ? (s.msgKind === 'warn' ? '#f0a04b' : '#eee8d9') : '#aaa596'
    };
  }
}
</script>
